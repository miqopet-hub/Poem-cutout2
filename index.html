<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carpet Diem</title>
<style>
  :root{--paper:#e8e0d0;--ink:#17130f}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);overflow-x:hidden}
  body{font-family:Georgia,"Times New Roman",serif}
  #loom{display:block;width:100%;image-rendering:auto}
  #name{
    position:fixed;z-index:5;top:16px;left:18px;
    font-size:14px;letter-spacing:.02em;mix-blend-mode:multiply;
    pointer-events:none
  }
  #hint{
    position:fixed;z-index:5;right:18px;bottom:16px;
    font:11px/1.2 system-ui,sans-serif;opacity:0;
    transition:opacity .2s;pointer-events:none
  }
  body:hover #hint{opacity:.45}
  @media(max-width:600px){
    #name{top:12px;left:12px}
    #hint{right:12px;bottom:12px}
  }
</style>
</head>
<body>
<div id="name">carpet.diem</div>
<div id="hint">E — export this moment</div>
<canvas id="loom"></canvas>

<script>
(() => {
  const canvas = document.getElementById('loom');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(devicePixelRatio || 1, 2);

  // One refresh = one deterministic carpet.
  const seed = (crypto.getRandomValues(new Uint32Array(1))[0]) >>> 0;
  let rngState = seed;

  function rnd(){
    rngState ^= rngState << 13; rngState ^= rngState >>> 17; rngState ^= rngState << 5;
    return ((rngState >>> 0) / 4294967296);
  }
  function pick(a){ return a[Math.floor(rnd()*a.length)] }

  // A restrained palette based on traditional Armenian carpet colors,
  // deliberately treated as a generative palette rather than a reconstruction.
  const palettes = [
    ['#191510','#8d2024','#c58b35','#e0c47b','#f0e4c9'],
    ['#201b16','#6f2925','#a9472e','#b98943','#ddd0ad'],
    ['#161816','#315044','#a56c37','#c9aa67','#e8dfc9'],
    ['#241b19','#713b45','#ad6f45','#d0a15e','#e7d7b6'],
    ['#171817','#7c2524','#b85d36','#d6ad61','#eee2c8']
  ];
  const palette = pick(palettes);

  let W = innerWidth;
  let unit = Math.max(14, Math.min(25, W / 38));
  let segmentH = unit * 10;
  let generated = 0;
  let targetScroll = 0;
  let userLookingBack = false;
  let lastTime = performance.now();
  let speed = unit * 1.25; // pixels / second

  function resize(){
    W = innerWidth;
    unit = Math.max(14, Math.min(25, W / 38));
    segmentH = unit * 10;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(Math.max(innerHeight, 900) * DPR);
    canvas.style.height = Math.max(innerHeight, 900) + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    draw();
  }
  addEventListener('resize', resize);

  // Store the woven history as compact segment seeds rather than pixels.
  const segments = [];
  function makeSegment(){
    const s = {
      seed: (rngState ^ Math.floor(generated / segmentH)) >>> 0,
      motif: Math.floor(rnd()*7),
      density: .72 + rnd()*.45,
      flip: rnd() > .5,
      accent: Math.floor(rnd()*palette.length)
    };
    segments.push(s);
    return s;
  }

  function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
  function diamond(cx,cy,r,c,inner=true){
    ctx.fillStyle=c;
    ctx.beginPath();
    ctx.moveTo(cx,cy-r);ctx.lineTo(cx+r,cy);ctx.lineTo(cx,cy+r);ctx.lineTo(cx-r,cy);ctx.closePath();ctx.fill();
    if(inner){
      ctx.strokeStyle=palette[0];ctx.lineWidth=Math.max(1,unit*.10);
      ctx.beginPath();ctx.moveTo(cx,cy-r*.55);ctx.lineTo(cx+r*.55,cy);ctx.lineTo(cx,cy+r*.55);ctx.lineTo(cx-r*.55,cy);ctx.closePath();ctx.stroke();
    }
  }
  function octagon(cx,cy,r,c){
    ctx.fillStyle=c;ctx.beginPath();
    for(let i=0;i<8;i++){const a=Math.PI/8+i*Math.PI/4;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=palette[0];ctx.lineWidth=Math.max(1,unit*.10);ctx.stroke();
  }
  function cross(cx,cy,r,c){
    ctx.fillStyle=c;
    const t=r*.36;
    ctx.fillRect(cx-t,cy-r,t*2,r*2);ctx.fillRect(cx-r,cy-t,r*2,t*2);
    ctx.strokeStyle=palette[0];ctx.lineWidth=Math.max(1,unit*.10);
    ctx.strokeRect(cx-t,cy-r,t*2,r*2);ctx.strokeRect(cx-r,cy-t,r*2,t*2);
  }
  function hook(cx,cy,r,c,flip){
    ctx.strokeStyle=c;ctx.lineWidth=r*.28;ctx.lineCap='square';
    ctx.beginPath();
    const d=flip?-1:1;
    ctx.moveTo(cx-r*.8,cy);
    ctx.lineTo(cx-r*.15,cy);
    ctx.lineTo(cx-r*.15+d*r*.55,cy-d*r*.55);
    ctx.lineTo(cx+d*r*.72,cy-d*r*.55);
    ctx.stroke();
  }

  function motif(x,y,type,scale,c,flip){
    const r=scale;
    if(type===0) diamond(x,y,r,c);
    if(type===1) octagon(x,y,r,c);
    if(type===2) cross(x,y,r,c);
    if(type===3){
      diamond(x,y,r,c,false);
      diamond(x,y,r*.48,palette[(palette.indexOf(c)+2)%palette.length],false);
      ctx.strokeStyle=palette[0];ctx.lineWidth=Math.max(1,unit*.10);
      ctx.strokeRect(x-r*.5,y-r*.5,r,r);
    }
    if(type===4){
      octagon(x,y,r,c);
      for(let i=0;i<4;i++) hook(x+(i%2?1:-1)*r*.75,y+(i<2?-1:1)*r*.72,r*.55,palette[(palette.indexOf(c)+1)%palette.length],i%2);
    }
    if(type===5){
      ctx.strokeStyle=c;ctx.lineWidth=r*.22;
      ctx.beginPath();
      for(let i=0;i<5;i++){const a=(i/4)*Math.PI*2-Math.PI/2;const px=x+Math.cos(a)*r*.8,py=y+Math.sin(a)*r*.8;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
      ctx.stroke();
      diamond(x,y,r*.28,palette[2],false);
    }
    if(type===6){
      diamond(x,y,r,c);
      for(let i=0;i<4;i++){
        const a=i*Math.PI/2+(flip?Math.PI/4:0);
        hook(x+Math.cos(a)*r*.95,y+Math.sin(a)*r*.95,r*.42,palette[(palette.indexOf(c)+3)%palette.length],i%2);
      }
    }
  }

  function drawSegment(s, y){
    const cols = Math.max(5,Math.floor(W/(unit*3.2)));
    const cell = W/cols;
    // Small edge guard, like the outer border of a woven carpet.
    rect(0,y,W,segmentH,palette[0]);

    const innerX = unit*1.25;
    const innerY = unit*1.0;
    rect(innerX,y+innerY,W-innerX*2,segmentH-innerY*2,palette[4]);

    // Border bands.
    const bw=unit*.72;
    rect(innerX,y+innerY,W-innerX*2,bw,palette[2]);
    rect(innerX,y+segmentH-innerY-bw,W-innerX*2,bw,palette[2]);
    rect(innerX,y+innerY,bw,segmentH-innerY*2,palette[2]);
    rect(W-innerX-bw,y+innerY,bw,segmentH-innerY*2,palette[2]);

    // Interlocking border diamonds.
    const bx=innerX+bw*.5;
    const by=y+innerY+bw*.5;
    for(let x=bx;x<W-innerX;x+=unit*2.0) diamond(x,by,unit*.48,palette[1],false);
    for(let x=bx;x<W-innerX;x+=unit*2.0) diamond(x,y+segmentH-innerY-bw*.5,unit*.48,palette[1],false);
    for(let yy=by+unit*2;yy<y+segmentH-innerY-bw;yy+=unit*2) diamond(bx,yy,unit*.48,palette[1],false);
    for(let yy=by+unit*2;yy<y+segmentH-innerY-bw;yy+=unit*2) diamond(W-innerX-bw*.5,yy,unit*.48,palette[1],false);

    const startX=innerX+bw+cell*.5;
    const startY=y+innerY+bw+cell*.28;
    const rows=Math.max(1,Math.floor((segmentH-innerY*2-bw*2)/(unit*2.8)));
    for(let row=0;row<rows;row++){
      const yy=startY+row*unit*2.8;
      for(let col=0;col<cols-2;col++){
        const xx=startX+col*cell;
        const wave = Math.sin((col+row)*.85 + generated*.002);
        if(Math.abs(wave)>.98 && rnd()<.4) continue;
        const localType=(s.motif+row+col+(s.flip?col:0))%7;
        const cc=palette[1+((col+row+s.accent)%4)];
        const sc=unit*(.75 + .22*s.density);
        motif(xx,yy+Math.sin(col*.8+row)*unit*.18,localType,sc,cc,(col+row)%2===0);
      }
    }
  }

  function ensureHistory(){
    const need = Math.ceil((innerHeight*1.7 + generated + 1000)/segmentH);
    while(segments.length < need) makeSegment();
  }

  function draw(){
    ensureHistory();
    // The canvas is a moving window over the woven history.
    const top = Math.max(0, generated - Math.max(innerHeight*1.7,900));
    ctx.clearRect(0,0,W,Math.max(innerHeight,900));
    const first=Math.max(0,Math.floor(top/segmentH)-1);
    const last=Math.min(segments.length,first+Math.ceil(Math.max(innerHeight,900)/segmentH)+3);
    for(let i=first;i<last;i++){
      const y=i*segmentH-top;
      if(y<Math.max(innerHeight,900)+segmentH && y>-segmentH) drawSegment(segments[i],y);
    }
  }

  function follow(){
    // Keep the viewer at the newest woven edge unless they have deliberately
    // moved into the already-woven history.
    const max=Math.max(0,document.documentElement.scrollHeight-innerHeight);
    if(!userLookingBack) scrollTo(0,max);
  }

  function tick(now){
    const dt=Math.min(.05,(now-lastTime)/1000); lastTime=now;
    generated += speed*dt;
    draw();
    // Rebuild the document height so the browser has a real history to scroll through.
    document.body.style.height=Math.max(innerHeight,generated+innerHeight*0.8)+'px';
    follow();
    requestAnimationFrame(tick);
  }

  // Manual scrolling is intentionally limited to the already-woven past.
  addEventListener('wheel',e=>{
    if(e.deltaY<0){ userLookingBack=true; }
    else if(e.deltaY>0){
      const atBottom=scrollY >= document.documentElement.scrollHeight-innerHeight-3;
      if(atBottom){e.preventDefault();userLookingBack=false}
    }
  },{passive:false});

  addEventListener('scroll',()=>{
    const max=Math.max(0,document.documentElement.scrollHeight-innerHeight);
    if(scrollY < max-30) userLookingBack=true;
    else userLookingBack=false;
  });

  // Export the exact visible moment as a clean carpet image.
  function exportMoment(){
    const out=document.createElement('canvas');
    const scale=Math.min(2,Math.max(1,devicePixelRatio||1));
    out.width=Math.round(W*scale);out.height=Math.round(innerHeight*scale);
    const oc=out.getContext('2d'); oc.setTransform(scale,0,0,scale,0,0);
    oc.fillStyle=palette[4];oc.fillRect(0,0,W,innerHeight);
    const top=Math.max(0,generated-Math.max(innerHeight*1.7,900));
    const first=Math.max(0,Math.floor(top/segmentH)-1);
    const last=Math.min(segments.length,first+Math.ceil(innerHeight/segmentH)+3);
    // Render the same local window into the export.
    const old=ctx; // drawSegment only needs a context-like global, so temporarily swap.
    const saved=window.__ctxHack;
    // Directly reproduce by using the visible canvas crop when possible.
    // This preserves exactly what is on screen, including the current state.
    oc.drawImage(canvas,0,0,canvas.width/DPR,canvas.height/DPR,0,0,W,innerHeight);
    const a=document.createElement('a');
    const number=String(Math.floor(generated/segmentH)).padStart(6,'0');
    a.download='carpet_'+number+'.png';
    a.href=out.toDataURL('image/png');
    a.click();
  }

  addEventListener('keydown',e=>{
    if(e.key.toLowerCase()==='e') exportMoment();
  });
  addEventListener('dblclick',exportMoment);

  resize();
  document.body.style.height=Math.max(innerHeight,generated+innerHeight*.8)+'px';
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
