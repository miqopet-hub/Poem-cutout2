<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carpet Diem</title>
<style>
  :root { --paper:#e7dfcf; --ink:#17130f; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--paper); color:var(--ink); overflow-x:hidden; }
  body { font-family:Georgia,"Times New Roman",serif; }
  #loom {
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    display:block;
    z-index:0;
  }
  #name {
    position:fixed;
    z-index:5;
    top:16px;
    left:18px;
    font-size:14px;
    letter-spacing:.02em;
    mix-blend-mode:multiply;
    pointer-events:none;
  }
  #hint {
    position:fixed;
    z-index:5;
    right:18px;
    bottom:16px;
    font:11px/1.2 system-ui,sans-serif;
    opacity:0;
    transition:opacity .2s;
    pointer-events:none;
  }
  body:hover #hint { opacity:.42; }
  @media(max-width:600px) {
    #name { top:12px; left:12px; }
    #hint { right:12px; bottom:12px; }
  }
</style>
</head>
<body>
<div id="name">carpet.diem</div>
<div id="hint">E — export this moment</div>
<canvas id="loom"></canvas>

<script>
(() => {
  const canvas = document.getElementById('loom');
  const ctx = canvas.getContext('2d', { alpha:false });
  const DPR = Math.min(devicePixelRatio || 1, 2);

  // ------------------------------------------------------------
  // ONE REFRESH = ONE CARPET
  // The seed controls the whole woven history.
  // ------------------------------------------------------------
  const seed = crypto.getRandomValues(new Uint32Array(1))[0] >>> 0;

  function hash(n) {
    n = (n ^ 61) ^ (n >>> 16);
    n = Math.imul(n, 9);
    n = n ^ (n >>> 4);
    n = Math.imul(n, 0x27d4eb2d);
    n = n ^ (n >>> 15);
    return n >>> 0;
  }
  function rand(n) { return hash((seed ^ n) >>> 0) / 4294967296; }
  function choose(a,n) { return a[Math.floor(rand(n) * a.length)]; }

  // Restrained palettes inspired by Armenian carpet colour families.
  const palettes = [
    ['#2e2f54','#c93f43','#f0f1ca','#7b8768','#cdb878'],
    ['#26284b','#b8443e','#eee7c6','#7b8467','#c8aa70'],
    ['#343553','#c74743','#eceac8','#718067','#c59e66'],
    ['#29263d','#a83d42','#e8dfc2','#75816b','#c7aa72']
  ];

  let W = innerWidth;
  let H = innerHeight;
  let unit = 18;
  let sectionH = 760;

  // Pixels of carpet woven since the beginning of this page load.
  let woven = 0;

  // How fast the carpet moves through the viewport.
  // Deliberately visible, but not frantic.
  const SPEED = 34; // px / second

  // User can inspect the past. Once they reach the newest edge,
  // automatic movement resumes.
  let lookingBack = false;
  let last = performance.now();

  function resize() {
    W = innerWidth;
    H = innerHeight;
    unit = Math.max(11, Math.min(21, W / 39));
    sectionH = Math.max(440, Math.min(560, H * 0.72));

    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    render();
  }
  addEventListener('resize', resize);

  // ------------------------------------------------------------
  // GEOMETRY
  // ------------------------------------------------------------
  function fill(c) { ctx.fillStyle = c; }
  function stroke(c,w) {
    ctx.strokeStyle = c;
    ctx.lineWidth = w;
    ctx.lineJoin = 'miter';
    ctx.lineCap = 'square';
  }

  function polygon(points, c) {
    fill(c);
    ctx.beginPath();
    ctx.moveTo(points[0][0],points[0][1]);
    for(let i=1;i<points.length;i++) ctx.lineTo(points[i][0],points[i][1]);
    ctx.closePath();
    ctx.fill();
  }

  function diamond(x,y,r,c,outline=null,ow=1) {
    polygon([[x,y-r],[x+r,y],[x,y+r],[x-r,y]],c);
    if(outline) {
      stroke(outline,ow);
      ctx.beginPath();
      ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y);ctx.closePath();
      ctx.stroke();
    }
  }

  function octagon(x,y,r,c,outline=null,ow=1) {
    const p=[];
    for(let i=0;i<8;i++) {
      const a=Math.PI/8+i*Math.PI/4;
      p.push([x+Math.cos(a)*r,y+Math.sin(a)*r]);
    }
    polygon(p,c);
    if(outline) {
      stroke(outline,ow);
      ctx.beginPath();
      ctx.moveTo(p[0][0],p[0][1]);
      for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);
      ctx.closePath();ctx.stroke();
    }
  }

  function chevron(x,y,s,c,flip=1) {
    stroke(c,Math.max(2,s*.16));
    ctx.beginPath();
    ctx.moveTo(x-s*.9,y);
    ctx.lineTo(x-s*.15,y);
    ctx.lineTo(x+s*.5,y-flip*s*.58);
    ctx.lineTo(x+s*.9,y-flip*s*.58);
    ctx.stroke();
  }

  function branch(x,y,s,c,flip=1) {
    stroke(c,Math.max(2,s*.14));
    ctx.beginPath();
    ctx.moveTo(x,y+s*.75);
    ctx.lineTo(x,y-s*.05);
    ctx.lineTo(x+s*.55,y-s*.55*flip);
    ctx.moveTo(x,y+s*.25);
    ctx.lineTo(x-s*.55,y-s*.35*flip);
    ctx.moveTo(x,y-s*.05);
    ctx.lineTo(x+s*.35,y-s*.72*flip);
    ctx.stroke();
  }

  function hookedDiamond(x,y,s,c,flip=1) {
    stroke(c,Math.max(2,s*.12));
    ctx.beginPath();
    ctx.moveTo(x,y-s);
    ctx.lineTo(x+s*.78,y);
    ctx.lineTo(x+s*.38,y+s*.42*flip);
    ctx.lineTo(x+s*.05,y+s*.42*flip);
    ctx.moveTo(x+s*.78,y);
    ctx.lineTo(x+s*.42,y-s*.42*flip);
    ctx.lineTo(x+s*.05,y-s*.42*flip);
    ctx.stroke();
  }

  // ------------------------------------------------------------
  // SYMMETRIC CARPET MODULES
  //
  // We draw only the TOP-RIGHT quarter of the central ornament.
  // The same geometry is mirrored horizontally, vertically, and
  // both. This is the basic system we can feed with your future
  // carpet references.
  // ------------------------------------------------------------
  function mirrorQuarter(drawQuarter, cx, cy) {
    ctx.save();
    drawQuarter(1,1);
    ctx.scale(-1,1); ctx.translate(-2*cx,0); drawQuarter(-1,1);
    ctx.restore();

    ctx.save();
    ctx.scale(1,-1); ctx.translate(0,-2*cy); drawQuarter(1,-1);
    ctx.scale(-1,1); ctx.translate(-2*cx,0); drawQuarter(-1,-1);
    ctx.restore();
  }

  // ------------------------------------------------------------
  // MORPHING CARPET MODULE
  //
  // This is deliberately NOT a crossfade.
  // Shapes share the same six-point skeleton:
  //
  // triangle -> hexagon -> square
  //
  // The triangle and square are represented using six points, with
  // some points initially sitting on the same edge. They can therefore
  // physically move into the intermediate hexagon and then into the
  // square. The ornament itself changes shape rather than disappearing
  // and being replaced by another drawing.
  // ------------------------------------------------------------
  function morphPoint(a,b,t) {
    return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
  }

  function smooth(t) {
    return t*t*(3-2*t);
  }

  function morphPolygon(cx,cy,r,from,to,t,fillColor,outlineColor,ow) {
    const p=[];
    for(let i=0;i<6;i++) p.push(morphPoint(from[i],to[i],t));
    const scaled=p.map(q=>[cx+q[0]*r,cy+q[1]*r]);
    polygon(scaled,fillColor);
    if(outlineColor) {
      stroke(outlineColor,ow);
      ctx.beginPath();
      ctx.moveTo(scaled[0][0],scaled[0][1]);
      for(let i=1;i<scaled.length;i++) ctx.lineTo(scaled[i][0],scaled[i][1]);
      ctx.closePath();
      ctx.stroke();
    }
  }

  // All shapes have six control points. Duplicate/collinear points
  // allow the silhouette to become a genuine intermediate hexagon.
  // Regular polygon morphing. All intermediate silhouettes remain symmetric.
  function wrapAngle(a){while(a<=-Math.PI)a+=Math.PI*2;while(a>Math.PI)a-=Math.PI*2;return a;}
  function regularPoint(theta,sides){
    const alpha=-Math.PI/2, normal=alpha+Math.PI/sides;
    const delta=wrapAngle(theta-normal);
    const apothem=Math.cos(Math.PI/sides);
    const radius=apothem/Math.cos(delta);
    return [Math.cos(theta)*radius,Math.sin(theta)*radius];
  }
  function regularShape(sides,count=24){
    const p=[]; for(let i=0;i<count;i++){
      const theta=-Math.PI/2+Math.PI*2*i/count;
      p.push(regularPoint(theta,sides));
    } return p;
  }
  const SHAPES={triangle:regularShape(3),hexagon:regularShape(6),square:regularShape(4),diamond:regularShape(4)};
  function drawMorphMotif(x,y,r,fromName,toName,t,fillColor,outlineColor){
    const a=SHAPES[fromName],b=SHAPES[toName],tt=smooth(t);
    const p=a.map((q,i)=>[q[0]+(b[i][0]-q[0])*tt,q[1]+(b[i][1]-q[1])*tt]);
    polygon(p.map(q=>[x+q[0]*r,y+q[1]*r]),fillColor);
    if(outlineColor){stroke(outlineColor,Math.max(1,unit*.08));ctx.beginPath();
      ctx.moveTo(x+p[0][0]*r,y+p[0][1]*r);
      for(let i=1;i<p.length;i++)ctx.lineTo(x+p[i][0]*r,y+p[i][1]*r);
      ctx.closePath();ctx.stroke();}
  }
  function morphShapeState(x,y,r,phase,pal){
    const states=[['triangle','hexagon'],['hexagon','square'],['square','diamond'],['diamond','triangle']];
    const q=((phase%1)+1)%1*states.length,i=Math.floor(q)%states.length,t=q-Math.floor(q);
    const pair=states[i]; drawMorphMotif(x,y,r,pair[0],pair[1],t,pal[4],pal[0]);
  }


  function designValue(z,offset){
    const step=1350,k=Math.floor(z/step),t=smooth((z-k*step)/step);
    return rand(k*37+offset)+(rand((k+1)*37+offset)-rand(k*37+offset))*t;
  }
  function centralModule(sectionIndex,y0,pal){
    const cx=W/2,cy=y0+sectionH*.50,z=sectionIndex*sectionH+sectionH*.50;
    const bodyW=.82+.16*designValue(z,1),bodyH=.58+.18*designValue(z,2);
    const notch=.12+.13*designValue(z,3),armReach=.46+.18*designValue(z,4);
    const armRise=.23+.13*designValue(z,5),satellite=.57+.16*designValue(z,6);
    const satelliteY=.68+.16*designValue(z,7),centerScale=.25+.10*designValue(z,8);
    const r=Math.min(W*.38,sectionH*.46);
    const main=pal[1],light=pal[2],green=pal[3],gold=pal[4],dark=pal[0];
    const morphPhase=z/1500+designValue(z,9)*.9;

    fill(main);ctx.fillRect(cx-r*bodyW,cy-r*bodyH,r*bodyW*2,r*bodyH*2);

    stroke(light,Math.max(3,unit*.34));
    const q=[[-bodyW,-bodyH],[-bodyW+notch,-bodyH],[-bodyW*.48,-bodyH-.16],
             [-bodyW*.22,-bodyH-.16],[-bodyW*.10,-bodyH],[0,-bodyH]];
    mirrorQuarter(()=>{
      ctx.beginPath();ctx.moveTo(cx+q[0][0]*r,cy+q[0][1]*r);
      for(let i=1;i<q.length;i++)ctx.lineTo(cx+q[i][0]*r,cy+q[i][1]*r);ctx.stroke();
    },cx,cy);

    morphShapeState(cx,cy,r*centerScale,morphPhase,[dark,main,light,green,gold]);

    mirrorQuarter(()=>{
      stroke(light,Math.max(3,unit*.29));ctx.beginPath();
      ctx.moveTo(cx+r*.10,cy+r*.02);ctx.lineTo(cx+r*.10,cy-r*armRise);
      ctx.lineTo(cx+r*armReach,cy-r*(armRise+.18));ctx.stroke();
      morphShapeState(cx+r*armReach,cy-r*(armRise+.18),
        r*(.13+.07*designValue(z,10)),morphPhase*.78+.21,[dark,main,light,green,gold]);
    },cx,cy);

    const sideR=r*(.09+.05*designValue(z,11)),sideX=r*satellite,sideY=r*satelliteY;
    morphShapeState(cx-sideX,cy,sideR,morphPhase*.71+.1,[dark,main,light,green,gold]);
    morphShapeState(cx+sideX,cy,sideR,morphPhase*.71+.1,[dark,main,light,green,gold]);
    morphShapeState(cx,cy-sideY,sideR,morphPhase*.71+.26,[dark,main,light,green,gold]);
    morphShapeState(cx,cy+sideY,sideR,morphPhase*.71+.26,[dark,main,light,green,gold]);

    const cornerX=r*(.62+.12*designValue(z,12)),cornerY=r*(.76+.10*designValue(z,13));
    const cornerR=r*(.11+.05*designValue(z,14));
    morphShapeState(cx-cornerX,cy-cornerY,cornerR,morphPhase*.55+.3,[dark,main,light,green,gold]);
    morphShapeState(cx+cornerX,cy-cornerY,cornerR,morphPhase*.55+.3,[dark,main,light,green,gold]);
    morphShapeState(cx-cornerX,cy+cornerY,cornerR,morphPhase*.55+.3,[dark,main,light,green,gold]);
    morphShapeState(cx+cornerX,cy+cornerY,cornerR,morphPhase*.55+.3,[dark,main,light,green,gold]);
  }

  function border(sectionIndex, pal) {
    const dark=pal[0], red=pal[1], light=pal[2], green=pal[3], gold=pal[4];
    const bw=Math.max(28,W*.095);

    fill(dark);
    ctx.fillRect(0,0,bw,H);
    ctx.fillRect(W-bw,0,bw,H);

    fill(light);
    ctx.fillRect(bw*.20,0,bw*.19,H);
    ctx.fillRect(W-bw*.39,0,bw*.19,H);

    // Border motifs are part of the same moving carpet coordinate.
    // Their shapes morph in place while the whole border travels.
    const bh=Math.max(74,unit*5.3);
    const worldTop=scrollY;
    const first=Math.floor(worldTop/bh)-2;
    const last=Math.ceil((worldTop+H)/bh)+2;

    for(let n=first;n<=last;n++) {
      const worldY=n*bh;
      const yy=worldY-worldTop;
      if(yy<-bh||yy>H+bh)continue;

      const phase=worldY/920;

      // Mirrored red field / teeth.
      fill(red);
      ctx.beginPath();
      ctx.moveTo(bw*.40,yy);
      ctx.lineTo(bw*.92,yy+bh*.5);
      ctx.lineTo(bw*.40,yy+bh);
      ctx.closePath();ctx.fill();

      ctx.beginPath();
      ctx.moveTo(W-bw*.40,yy);
      ctx.lineTo(W-bw*.92,yy+bh*.5);
      ctx.lineTo(W-bw*.40,yy+bh);
      ctx.closePath();ctx.fill();

      // These used to be static black/white dashes.
      // They now physically transform: diamond -> hexagon -> square.
      morphShapeState(bw*.63,yy+bh*.5,bh*.18,phase,[dark,red,light,green,gold]);
      morphShapeState(W-bw*.63,yy+bh*.5,bh*.18,phase,[dark,red,light,green,gold]);

      // Cream checks also morph gradually by changing their width and height.
      const check=unit*.62;
      const checkPhase=(Math.sin(phase*Math.PI*2)+1)/2;
      const cw=check*(.45+.55*checkPhase);
      const ch=check*(1.15-.30*checkPhase);
      fill(light);
      ctx.fillRect(bw*.02,yy+bh*.08,cw,ch);
      ctx.fillRect(W-bw*.02-cw,yy+bh*.08,cw,ch);
      ctx.fillRect(bw*.02,yy+bh*.82-cw,ch,cw);
      ctx.fillRect(W-bw*.02-ch,yy+bh*.82-cw,ch,cw);
    }
  }


  function sectionPalette(i) {
    return choose(palettes,i*97+11);
  }

  // ------------------------------------------------------------
  // RENDERING THE ACTUAL VIEWPORT
  //
  // worldY = where the top of the viewport sits on the woven carpet.
  // Since worldY is tied to scrollY, going upward shows exactly the
  // material that has already been woven.
  // ------------------------------------------------------------
  function render() {
    const worldY=scrollY;
    fill('#e7dfcf');
    ctx.fillRect(0,0,W,H);

    const first=Math.floor(worldY/sectionH)-1;
    const last=Math.ceil((worldY+H)/sectionH)+1;

    for(let i=first;i<=last;i++) {
      if(i<0) continue;
      const y=i*sectionH-worldY;
      const pal=sectionPalette(i);
      fill(pal[0]);
      ctx.fillRect(0,y,W,sectionH);

      // A very slight overlap keeps sections visually connected.
      centralModule(i,y,pal);
    }

    border(Math.floor(worldY/sectionH),sectionPalette(Math.floor(worldY/sectionH)));
  }

  // ------------------------------------------------------------
  // THE ACTUAL INFINITE MOTION
  // ------------------------------------------------------------
  function tick(now) {
    const dt=Math.min(.05,(now-last)/1000);
    last=now;

    // The carpet continues to be woven whether or not the viewer looks back.
    woven += SPEED*dt;

    // Real document length. The newest edge is always just ahead of us.
    const pageHeight=Math.max(H+1,woven+H);
    document.body.style.height=pageHeight+'px';

    if(!lookingBack) {
      // Follow the newest edge exactly. No easing, no jumping.
      const max=Math.max(0,pageHeight-H);
      if(scrollY < max-1) scrollTo(0,max);
    }

    render();
    requestAnimationFrame(tick);
  }

  // Only upward inspection is allowed.
  addEventListener('wheel',e=>{
    const max=Math.max(0,document.documentElement.scrollHeight-H);
    if(e.deltaY<0) {
      lookingBack=true;
    } else if(e.deltaY>0 && scrollY>=max-2) {
      e.preventDefault();
      lookingBack=false;
    }
  },{passive:false});

  addEventListener('scroll',()=>{
    const max=Math.max(0,document.documentElement.scrollHeight-H);
    if(scrollY>=max-3) lookingBack=false;
    else lookingBack=true;
    render();
  },{passive:true});

  // Touch: upward = inspect the past; downward stops at the newest edge.
  let touchY=0;
  addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});
  addEventListener('touchmove',e=>{
    const dy=e.touches[0].clientY-touchY;
    if(dy>0) lookingBack=true;
    touchY=e.touches[0].clientY;
  },{passive:true});

  // ------------------------------------------------------------
  // EXPORT: exactly the current viewport.
  // ------------------------------------------------------------
  function exportMoment() {
    const scale=Math.min(2,Math.max(1,devicePixelRatio||1));
    const out=document.createElement('canvas');
    out.width=Math.round(W*scale);
    out.height=Math.round(H*scale);
    const oc=out.getContext('2d');

    // Render through a temporary context by copying the current screen.
    oc.drawImage(canvas,0,0,out.width,out.height);

    const section=Math.floor(scrollY/sectionH);
    const number=String(Math.max(0,section)).padStart(5,'0');

    const a=document.createElement('a');
    a.download='carpet_'+number+'.png';
    a.href=out.toDataURL('image/png');
    a.click();
  }

  addEventListener('keydown',e=>{
    if(e.key.toLowerCase()==='e') exportMoment();
  });
  addEventListener('dblclick',exportMoment);

  resize();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
